<section class="pub-other-topics" aria-labelledby="other-topics-title"><h2 id="other-topics-title">Explore another question.</h2><div>{% for topic in site.data.writing.topics %}{% if topic.id != include.active %}<a data-stage="{{ topic.stage }}" href="{{ topic.url | relative_url }}"><span class="pub-kicker">{{ topic.stage }} · {{ topic.label }}</span><span>{{ topic.question }} →</span></a>{% endif %}{% endfor %}</div></section>
