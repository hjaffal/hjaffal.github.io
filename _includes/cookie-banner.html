<div id="cookie-banner" class="publication-cookie-note" hidden>
  <div><p>This site uses cookies and analytics to understand readership.</p><button id="cookie-accept" type="button">Dismiss notice</button></div>
</div>
<script>
(function () {
  var banner = document.getElementById('cookie-banner');
  try { banner.hidden = localStorage.getItem('cookie_accepted') === '1'; }
  catch (error) { banner.hidden = false; }
  document.getElementById('cookie-accept').addEventListener('click', function () {
    try { localStorage.setItem('cookie_accepted', '1'); } catch (error) {}
    banner.hidden = true;
  });
})();
</script>
