<div id="contact-form-wrapper">
  <form id="contact-form" class="contact-form" data-endpoint="{{ site.data.firebase.fn_contact }}">
    <input type="text" name="_gotcha" class="publication-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="contact-row"><div><label for="contact-name">Name</label><input type="text" id="contact-name" name="name" autocomplete="name" maxlength="200" required></div><div><label for="contact-email">Email address</label><input type="email" id="contact-email" name="email" autocomplete="email" required></div></div>
    <div><label for="contact-subject">What is your message about?</label><select id="contact-subject" name="subject" required><option value="">Choose a topic</option><option value="General inquiry">General question</option><option value="Writing & Field Intelligence">An article, a question, or a different view</option><option value="Collaboration or Partnership">Collaboration or an invitation</option><option value="Newsletter">The Second Mind newsletter</option><option value="The Second Mind (Book)">The Second Mind book</option><option value="Downloadable Materials & Templates">Resources and templates</option><option value="AI Job Risk Analyzer">AI Job Risk Analyzer</option><option value="AI Job Risk Directory">AI Job Risk Directory</option><option value="Future-Proof Skills Assessment">Future-Proof Skills Assessment</option><option value="Lexicon">Lexicon</option><option value="Sproochentest & Luxembourgish">Gepackt and Luxembourgish learning</option><option value="Bug report or Technical issue">A problem with the website</option><option value="Other">Something else</option></select></div>
    <div><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="7" maxlength="5000" required aria-describedby="contact-message-help"></textarea><p class="form-help" id="contact-message-help">Include a relevant article or page link and the question you want to discuss.</p></div>
    <label class="contact-consent-label"><input type="checkbox" id="contact-consent" name="newsletter"><span>Also send me future articles by email. <span class="form-optional">Optional</span></span></label>
    <button type="submit" id="contact-submit-btn" disabled>Send message</button>
  </form>
  <noscript><p>To send a message without JavaScript, email <a href="mailto:{{ site.social-network-links.email }}">{{ site.social-network-links.email }}</a>.</p></noscript>
</div>
<div id="contact-success" class="contact-success" tabindex="-1" role="status" hidden><h3>Message sent.</h3><p>Thank you for writing. Your message has been received.</p><p id="contact-newsletter-result"></p><button type="button" id="contact-send-another">Send another message</button></div>
<div id="contact-error" class="contact-error" role="alert" hidden><p>Could not send your message. Please try again or email <a href="mailto:{{ site.social-network-links.email }}">{{ site.social-network-links.email }}</a>.</p></div>
