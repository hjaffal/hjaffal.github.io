title: Hasan Jaffal
url: "https://hasanjaffal.com"
author: Hasan Jaffal

navbar-links:
  Writing: "writing"
  Topics:
    - _url: "topics"
    - Opportunities: "topics/opportunities"
    - Investment decisions: "topics/investment-decisions"
    - People & adoption: "topics/people-and-adoption"
    - Outcomes & evidence: "topics/outcomes-and-evidence"
  About: "aboutme"
  Newsletter: "newsletter"
  Tools:
    - _url: "tools"
    - AI Job Risk Analyzer: "ai-job-risk-analyzer"
    - AI Job Risk Directory: "ai-job-risk-directory"
    - Future-Proof Skills Assessment: "future-proof-skills-assessment"
    - Templates: "ai-templates"
    - Lexicon: "lexicon"
  Contact: "contact"

avatar: "/og-default.png"
round-avatar: false

social-network-links:
  email: "jaftalks@gmail.com"
  linkedin: jaffal

rss-description: "Articles on AI opportunities, investment decisions, people and adoption, and the evidence of business value."

share-links-active:
  twitter: true
  facebook: false
  linkedin: true
  reddit: true
  vk: false

url-pretty: "hasanjaffal.com"
title-on-all-pages: true

excerpt_length: 45
feed_show_excerpt: true
feed_show_tags: false
post_search: false
edit_page_button: false
navbar-var-length: false

page-col: "#FFFFFF"
text-col: "#0F172A"

link-col: "#0F172A"
hover-col: "#9333EA"

navbar-col: "#FFFFFF"
navbar-text-col: "#0F172A"
navbar-border-col: "#E2E8F0"

footer-col: "#0F172A"
footer-text-col: "#94A3B8"
footer-link-col: "#F1F5F9"
footer-hover-col: "#9333EA"

site-css:
  - "/assets/css/global.css"
  - "/assets/css/header.css"

site-js:
  - "/assets/js/subscribe.js"
  - "/assets/js/custom-script.js"

gtag: "G-WT6WZ9E4SH"

date_format: "%B %-d, %Y"

timezone: "Europe/Luxembourg"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
      chat_with_me_box: false

  -
    scope:
      path: ""
    values:
      layout: "page"
      chat_with_me_box: false

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - scripts/
  - all-ai-job-risk-audits.md

plugins:
  - jekyll-paginate
